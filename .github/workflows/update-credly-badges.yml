name: Update Credly Badges

on:
  schedule:
    - cron: "30 20 * * *" # Daily at 02:00 India Standard Time
  workflow_dispatch: # Manual trigger
  push:
    branches: [master]
    paths:
      - .github/workflows/update-credly-badges.yml
      - fetch_credly_badges.py
      - tests/test_fetch_credly_badges.py

permissions:
  contents: write

concurrency:
  group: credly-refresh
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check feed preservation and parsing
        run: python -m unittest discover -s tests -p 'test_fetch_credly_badges.py' -v

      - name: Fetch public Credly badge feed
        env:
          CREDLY_USERNAME: sunil-sarolkar # Change to your username if needed
        run: |
          python fetch_credly_badges.py

      - name: Commit and push badge updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/credly_badges.json _data/credly_sync.json
          if git diff --cached --quiet; then
            echo "Badge feed is unchanged."
          else
            git commit -m "Update Credly badges [auto]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
